[project]
name = "licita"
version = "0.1.0"
description = "Copiloto con IA para pymes que le venden al Estado vía Mercado Público"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.11",
    "fastapi>=0.110",
    "httpx>=0.27",
    "jinja2>=3.1",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "tzdata>=2024.1",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
licita = "licita.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
licita = ["plantillas/*.html", "plantillas/*.txt", "estaticos/*", "migraciones/*.py", "migraciones/*.mako", "migraciones/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
