[project]
name = "licita"
version = "0.1.0"
description = "Copiloto con IA para pymes que le venden al Estado vía Mercado Público"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.11",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
licita = "licita.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
