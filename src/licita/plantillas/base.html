<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Calza{% endblock %}</title>
<meta name="description" content="Calza te avisa por WhatsApp las licitaciones de Mercado Público que calzan con tu negocio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#17283a; --muted:#5b6b7c; --line:#d7dee6;
  --brand:#1d5a7a; --brand-ink:#ffffff; --brand-soft:#e1edf3; --gold:#a8650a; --gold-soft:#f8ecd6;
  --ok:#2f7d4f; --ok-soft:#e2f1e8; --error:#b3261e; --error-soft:#fbe9e7;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10171e; --surface:#17212b; --ink:#e6edf3; --muted:#9aabbb; --line:#2a3846;
  --brand:#7dbbd9; --brand-ink:#0d1a22; --brand-soft:#1b3342; --gold:#e8a948; --gold-soft:#3a2c14;
  --ok:#7ccf9c; --ok-soft:#173326; --error:#f2a49c; --error-soft:#3a1d1a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
a{color:var(--brand)}
.contenedor{max-width:1040px;margin:0 auto;padding-inline:16px}
header.sitio{padding-block:18px;border-bottom:1px solid var(--line);background:var(--surface)}
header.sitio .contenedor{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-family:var(--display);font-weight:700;font-size:26px;color:var(--ink);text-decoration:none;letter-spacing:-.02em}
.logo span{color:var(--gold)}
main{padding-block:40px 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,5vw,50px);letter-spacing:-.02em}
h2{font-size:28px;margin-bottom:16px}
h3{font-size:20px}
p{margin:0}
.lead{color:var(--muted);font-size:18px;max-width:60ch}
.boton{display:inline-block;background:var(--brand);color:var(--brand-ink);font-weight:600;padding:12px 20px;border-radius:10px;text-decoration:none;border:0;font-size:16px;font-family:var(--body);cursor:pointer}
.boton:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.boton.secundario{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.tarjeta{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.pila{display:flex;flex-direction:column;gap:16px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px}
.rejilla.dos{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.tarjeta.plan > :last-child{margin-top:auto}
.pila > h2{margin-top:16px}
.chip{display:inline-block;width:fit-content;align-self:flex-start;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.chip.oro{background:var(--gold-soft);color:var(--gold)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.error{background:var(--error-soft);color:var(--error)}
.precio{font-family:var(--display);font-size:36px;font-weight:700;font-variant-numeric:tabular-nums}
.precio small{font-family:var(--body);font-size:15px;font-weight:400;color:var(--muted)}
.muted{color:var(--muted)}
ul.check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
ul.check li::before{content:"✓ ";color:var(--ok);font-weight:700}
label{font-weight:600;display:block;margin-bottom:4px}
input[type=text],input[type=email],input[type=tel],input[type=number],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
textarea{min-height:110px}
.ayuda{font-size:14px;color:var(--muted);margin-top:4px}
.error{font-size:14px;color:var(--error);margin-top:4px}
.aviso{background:var(--error-soft);color:var(--error);padding:12px 16px;border-radius:10px}
.casillas{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 16px}
.casillas label,.opcion{font-weight:400;display:flex;gap:8px;align-items:flex-start}
footer.sitio{border-top:1px solid var(--line);padding-block:24px;font-size:14px;color:var(--muted)}
footer.sitio .contenedor{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.tabla{overflow-x:auto}
</style>
</head>
<body>
<header class="sitio"><div class="contenedor">
  <a class="logo" href="/">calza<span>.</span></a>
  {% block accion %}<a class="boton secundario" href="/registro">Probar gratis</a>{% endblock %}
</div></header>
<main><div class="contenedor">{% block contenido %}{% endblock %}</div></main>
<footer class="sitio"><div class="contenedor">
  <span>Calza es un servicio independiente, no afiliado a ChileCompra ni a Mercado Público.</span>
  <span><a href="/terminos">Términos</a> · <a href="/privacidad">Privacidad</a> · hola@calza.cl</span>
</div></footer>
</body>
</html>
